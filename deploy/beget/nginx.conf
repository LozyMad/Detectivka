# Replace example.com with your domain before enabling this configuration.
# Certbot adds HTTPS after DNS points to this server.
server {
    listen 80;
    server_name example.com www.example.com;

    # Full scenario packages accept up to 250 MB, plus multipart overhead.
    client_max_body_size 260m;

    location ~ ^/api/game/room/[0-9]+/events$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        # The application does not send periodic SSE heartbeats.
        proxy_read_timeout 24h;
        # This endpoint includes an authentication token in its query string.
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}

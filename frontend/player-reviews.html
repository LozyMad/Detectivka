<link rel="icon" type="image/png" href="/favicon.png?v=2" sizes="192x192"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка ответов и гонорар — Детектум</title><link rel="stylesheet" href="/css/player.css?v=4"><link rel="stylesheet" href="/css/player-scoring.css?v=1"></head><body><header class="player-header"><div class="shell header-inner"><a class="brand" href="/admin">ДЕТЕКТУМ</a><a href="/admin#player-management">← Панель организатора</a></div></header><main class="shell"><section><span class="eyebrow">Самостоятельные и организованные игры</span><h1>Проверка ответов</h1><p class="muted">Оцените каждый ответ от 0 до 5. Гонорар учитывает качество ответов и число поездок. Черновик виден организатору; публикация покажет результат игроку.</p><div class="filters"><select id="review-status" aria-label="Статус проверки"><option value="pending_review">Ожидают проверки</option><option value="graded">Опубликованные</option><option value="all">Все завершённые</option></select><button class="button secondary small" id="review-refresh" type="button">Обновить</button></div><p id="review-error" class="error" role="alert" hidden></p><p id="review-notice" class="notice" role="status" hidden></p><div id="reviews" class="review-layout"><div id="review-list" class="review-list">Загружаем игры…</div><div id="review-detail" class="review-detail"><p class="muted">Выберите комнату для проверки.</p></div></div></section></main><script src="/js/player-reviews.js?v=ai-room-recovery1"></script></body></html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Детектум - Вход в игру</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css?v=7" rel="stylesheet">
    <style>
        .game-login-body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
        }
        
        .game-card {
            background: rgba(45, 45, 45, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            box-shadow: 0 25px 50px var(--noir-shadow);
            border: 2px solid rgba(212, 175, 55, 0.3);
            position: relative;
            z-index: 1;
        }
        
        .game-icon {
            color: var(--noir-gold);
            font-size: 3rem;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.5));
            transition: all 0.3s ease;
        }
        
        .game-icon:hover {
            transform: scale(1.1);
            filter: drop-shadow(0 0 15px var(--noir-gold));
        }
        
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(45, 45, 45, 0.9);
            border: 1px solid var(--noir-gold);
            color: var(--noir-gold);
            transition: all 0.3s ease;
        }
        
        .back-btn:hover {
            background: var(--noir-gold);
            color: var(--noir-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px var(--noir-shadow);
        }
        
        .help-text {
            background: rgba(212, 175, 55, 0.1);
            border-left: 4px solid var(--noir-gold);
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
        }
    </style>
    <link href="css/design-system.css?v=6" rel="stylesheet">
    <link href="css/dark-interface.css?v=3" rel="stylesheet">
</head>
<body class="game-login-body">
    <button class="btn btn-outline-light back-btn back-link" onclick="goBack()">
        <i class="fas fa-arrow-left me-2"></i>Назад
    </button>
    
    <div class="container auth-container fade-in-noir">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="game-card auth-card p-5">
                    <div class="text-center mb-4">
                        <div class="game-icon auth-icon mb-3">
                            <i class="fas fa-search"></i>
                        </div>
                        <h2 class="fw-bold auth-title">Вход в игру</h2>
                        <p class="text-muted auth-subtitle">Присоединиться к игровой комнате</p>
                    </div>
                    
                    <div id="message" class="mt-3" aria-live="polite"></div>
                    <form id="gameLoginForm">
                        <div class="mb-3">
                            <label for="roomUsername" class="form-label">
                                <i class="fas fa-user me-2"></i>Название команды
                            </label>
                            <input type="text" class="form-control form-control-lg" id="roomUsername" autocomplete="username" data-no-persist
                                   placeholder="Введите название команды" required>
                        </div>
                        
                        <div class="mb-4">
                            <label for="roomPassword" class="form-label">
                                <i class="fas fa-lock me-2"></i>Пароль команды
                            </label>
                            <input type="password" class="form-control form-control-lg" id="roomPassword" autocomplete="current-password"
                                   placeholder="Пароль от организатора" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                            <i class="fas fa-play me-2"></i>Начать игру
                        </button>
                    </form>
                    
                    <div class="help-text">
                        <h6 class="mb-2">
                            <i class="fas fa-lightbulb me-2"></i>Как получить данные для входа?
                        </h6>
                        <ul class="mb-0 small">
                            <li><strong>Название команды и пароль</strong> — получите у организатора игры</li>
                            <li>Если у вас нет данных, обратитесь к организатору</li>
                        </ul>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>

    <script src="js/game-session.js?v=1"></script>
    <script src="js/game-auth.js?v=3"></script>
    <script src="js/persist-inputs.js"></script>
    <script src="js/no-copy.js?v=1"></script>
    <script>
        function goBack() {
            window.location.href = '/login';
        }
        
    </script>
</body>
</html>

name: Check site connectivity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/check-site.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check DNS and public HTTP responses
        shell: bash
        run: |
          for HOST in detektum.ru www.detektum.ru; do
            IP=$(getent ahostsv4 "$HOST" | awk 'NR==1 {print $1}')
            echo "::notice::DNS $HOST = $IP"
          done
          for URL in http://detektum.ru/ https://detektum.ru/ http://www.detektum.ru/ https://www.detektum.ru/; do
            RESULT=$(curl -4 -sS -I -o /dev/null --connect-timeout 8 --max-time 15 \
              -w 'http=%{http_code} remote=%{remote_ip} connect=%{time_connect} tls=%{time_appconnect} total=%{time_total}' "$URL") && EXIT_CODE=0 || EXIT_CODE=$?
            echo "::notice::$URL curl_exit=$EXIT_CODE $RESULT"
          done
          for HOST in detektum.ru www.detektum.ru; do
            RESULT=$(curl -4 -sS -I -o /dev/null --resolve "$HOST:443:159.194.245.92" \
              --connect-timeout 8 --max-time 15 \
              -w 'http=%{http_code} remote=%{remote_ip} connect=%{time_connect} tls=%{time_appconnect} total=%{time_total}' "https://$HOST/") && EXIT_CODE=0 || EXIT_CODE=$?
            echo "::notice::Direct-IP https://$HOST/ curl_exit=$EXIT_CODE $RESULT"
          done

name: Deploy to Beget

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check deploy secret
        run: |
          if [ -z "$DEPLOY_SECRET" ]; then
            echo "::error::DETEKTUM is not set. Add it in repo Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi
          echo "DEPLOY_SECRET is set (length: ${#DEPLOY_SECRET} chars)"
        env:
          DEPLOY_SECRET: ${{ secrets.DETEKTUM }}

      - name: Call deploy webhook on server
        env:
          DEPLOY_SECRET: ${{ secrets.DETEKTUM }}
          DEPLOY_URL: https://detektum.ru/api/deploy
        run: |
          echo "Calling deploy endpoint..."
          RESP=$(curl -s -w "\n%{http_code}" -X POST "$DEPLOY_URL" \
            -H "X-Deploy-Secret: $DEPLOY_SECRET" \
            --connect-timeout 15 --max-time 180) || true
          BODY=$(echo "$RESP" | head -n -1)
          CODE=$(echo "$RESP" | tail -n 1)
          echo "Response code: $CODE"
          echo "Response body: $BODY"
          if [ "$CODE" = "200" ]; then
            echo "Deploy OK"
          else
            if [ "$CODE" = "000" ]; then
              echo "::error::Connection failed (000). Check pm2 status, Nginx, HTTPS and DNS for detektum.ru."
            else
              echo "::error::Deploy failed (code $CODE). Check GitHub secret DETEKTUM matches DEPLOY_SECRET in server .env."
            fi
            exit 1
          fi

      - name: Verify the updated address book after restart
        env:
          DEPLOY_SECRET: ${{ secrets.DETEKTUM }}
        run: |
          for ATTEMPT in 1 2 3 4 5 6; do
            sleep 10
            RESP=$(curl -s -w "\n%{http_code}" -X POST https://detektum.ru/api/deploy \
              -H "X-Deploy-Secret: $DEPLOY_SECRET" -H "Content-Type: application/json" \
              --data '{"verifyOnly":true}' --connect-timeout 10 --max-time 20) || true
            BODY=$(echo "$RESP" | head -n -1)
            CODE=$(echo "$RESP" | tail -n 1)
            echo "Verification $ATTEMPT: HTTP $CODE $BODY"
            if [ "$CODE" = "200" ] && echo "$BODY" | jq -e '.ok == true and .address_book.ready == true' > /dev/null; then
              exit 0
            fi
          done
          echo "::error::Address book migration was not confirmed after restart."
          exit 1

name: Deploy to Timeweb

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-timeweb
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Test exact address book restoration
        run: python3 scripts/test_address_book_backup.py

      - name: Check deploy secret
        run: |
          if [ -z "$DEPLOY_SECRET" ]; then
            echo "::error::TIMEWEB_DEPLOY_SECRET is not set in repository Actions secrets."
            exit 1
          fi
          echo "DEPLOY_SECRET is set (length: ${#DEPLOY_SECRET} chars)"
        env:
          DEPLOY_SECRET: ${{ secrets.TIMEWEB_DEPLOY_SECRET }}

      - name: Call deploy webhook on server
        env:
          DEPLOY_SECRET: ${{ secrets.TIMEWEB_DEPLOY_SECRET }}
          DEPLOY_URL: https://179.236.41.171/api/deploy
        run: |
          echo "Calling deploy endpoint..."
          RESP=$(curl -s -w "\n%{http_code}" -X POST "$DEPLOY_URL" \
            -H "X-Deploy-Secret: $DEPLOY_SECRET" \
            --connect-timeout 15 --max-time 180) || true
          BODY=$(echo "$RESP" | head -n -1)
          CODE=$(echo "$RESP" | tail -n 1)
          echo "Response code: $CODE"
          echo "Response body: $BODY"
          if [ "$CODE" = "200" ]; then
            echo "Deploy OK"
          else
            if [ "$CODE" = "000" ]; then
              echo "::error::Connection to Timeweb failed. Check PM2, Nginx and HTTPS on 179.236.41.171."
            else
              echo "::error::Deploy failed (code $CODE). Check TIMEWEB_DEPLOY_SECRET matches DEPLOY_SECRET on Timeweb."
            fi
            exit 1
          fi

      - name: Verify address book migration after restart
        env:
          DEPLOY_SECRET: ${{ secrets.TIMEWEB_DEPLOY_SECRET }}
          DEPLOY_URL: https://179.236.41.171/api/deploy
        run: |
          for ATTEMPT in 1 2 3 4 5 6; do
            sleep 10
            RESP=$(curl -s -w "\n%{http_code}" -X POST "$DEPLOY_URL" \
              -H "X-Deploy-Secret: $DEPLOY_SECRET" -H "Content-Type: application/json" \
              --data '{"verifyOnly":true}' --connect-timeout 10 --max-time 20) || true
            BODY=$(echo "$RESP" | head -n -1)
            CODE=$(echo "$RESP" | tail -n 1)
            echo "Verification $ATTEMPT: HTTP $CODE $BODY"
            if [ "$CODE" = "200" ] && echo "$BODY" | jq -e '.ok == true and .address_book.ready == true' > /dev/null; then
              exit 0
            fi
          done
          echo "::error::Address book migration was not confirmed after restart."
          exit 1

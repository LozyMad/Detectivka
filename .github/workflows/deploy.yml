name: Deploy to Beget

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check deploy secret
        run: |
          if [ -z "$DEPLOY_SECRET" ]; then
            echo "::error::DEPLOY_SECRET is not set. Add it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "DEPLOY_SECRET is set (length: ${#DEPLOY_SECRET} chars)"
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}

      - name: Call deploy webhook on server
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          DEPLOY_URL: https://www.detektum.ru/api/deploy
        run: |
          echo "Calling deploy endpoint..."
          RESP=$(curl -s -w "\n%{http_code}" -X POST "$DEPLOY_URL" \
            -H "X-Deploy-Secret: $DEPLOY_SECRET" \
            --connect-timeout 15 --max-time 45) || true
          BODY=$(echo "$RESP" | head -n -1)
          CODE=$(echo "$RESP" | tail -n 1)
          echo "Response code: $CODE"
          echo "Response body: $BODY"
          if [ "$CODE" = "200" ]; then
            echo "Deploy OK"
          else
            if [ "$CODE" = "000" ]; then
              echo "::error::Connection failed (000). Check pm2 status, Nginx, HTTPS and DNS for www.detektum.ru."
            else
              echo "::error::Deploy failed (code $CODE). Check DEPLOY_SECRET and server .env."
            fi
            exit 1
          fi
